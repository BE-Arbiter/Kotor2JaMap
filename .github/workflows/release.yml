name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build Kotor2Ja.sln -c Release

      - name: Test (tests that need an installed game skip themselves)
        run: dotnet test Kotor2Ja.sln -c Release --no-build

      - name: Publish portable package
        shell: pwsh
        run: pwsh scripts/publish.ps1

      - name: Create the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" artifacts/Kotor2Ja-win-x64.zip --title "${{ github.ref_name }}" --generate-notes --verify-tag
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
