name: build-latest

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build Kotor2Ja.sln -c Release

      - name: Test (tests that need an installed game skip themselves)
        run: dotnet test Kotor2Ja.sln -c Release --no-build

      - name: Publish portable package
        shell: pwsh
        run: pwsh scripts/publish.ps1

      - name: Replace the "latest" release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag
          if ($LASTEXITCODE -ne 0) { $global:LASTEXITCODE = 0 }
          gh release create latest artifacts/Kotor2Ja-win-x64.zip --prerelease --title "Latest build" --notes "Automated build of ${{ github.sha }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
